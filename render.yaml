services:
  - type: web
    name: api-financial
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DB_USE_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: JWT_ACCESS_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7"
      - key: DB_HOST
        fromDatabase:
          name: api-financial-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: api-financial-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: api-financial-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: api-financial-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: api-financial-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://app-financial.vercel.app,https://app-financial-git-main.vercel.app"

databases:
  - name: api-financial-db
    databaseName: api_financial
    plan: free
